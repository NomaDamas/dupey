name: CI

on:
  push:
    branches:
      - main
      - "issue-8/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Build release CLI
        run: cargo build --workspace --release --locked
      - name: Run cross-platform end-to-end checks
        run: python scripts/e2e.py
