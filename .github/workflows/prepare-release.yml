---
name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example, 0.1.1)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Bump, tag, and create release
    runs-on: ubuntu-latest
    environment: release
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Allow organization owners only
        env:
          RELEASE_OWNERS: ${{ vars.RELEASE_OWNERS }}
        shell: bash
        run: |
          owners=",${RELEASE_OWNERS// /},"
          if [[ "$owners" != *",${GITHUB_ACTOR},"* ]]; then
            echo "Only NomaDamas organization owners may prepare releases."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy,rustfmt

      - name: Validate requested version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version such as 0.1.1, without a leading v."
            exit 1
          fi

          current="$(cargo metadata --no-deps --format-version 1 |
            jq -r '[.packages[] | select(.name == "dupey-core")][0].version')"
          if [[ "$RELEASE_VERSION" == "$current" ]]; then
            echo "Version $RELEASE_VERSION is already prepared; continuing to tag it."
            echo "needs_bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_bump=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$(printf '%s\n' "$current" "$RELEASE_VERSION" | sort -V | tail -n1)" != "$RELEASE_VERSION" ]]; then
            echo "Version $RELEASE_VERSION must be newer than $current."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            echo "Tag v${RELEASE_VERSION} already exists."
            exit 1
          fi

          for package in dupey-core dupey; do
            if cargo info --registry crates-io "${package}@${RELEASE_VERSION}" >/dev/null 2>&1; then
              echo "${package} ${RELEASE_VERSION} is already published."
              exit 1
            fi
          done

      - name: Update workspace version
        if: steps.version.outputs.needs_bump == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          path = Path("Cargo.toml")
          text = path.read_text()
          old = 'version = "'
          start = text.index(old) + len(old)
          end = text.index('"', start)
          text = text[:start] + version + text[end:]

          dependency = 'dupey-core = { path = "crates/dupey-core", version = "'
          start = text.index(dependency) + len(dependency)
          end = text.index('"', start)
          text = text[:start] + version + text[end:]
          path.write_text(text)
          PY
          cargo check --workspace

      - name: Run release checks
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --locked
          cargo build --workspace --release --locked
          cargo package --locked --allow-dirty -p dupey-core

      - name: Commit version bump
        if: steps.version.outputs.needs_bump == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "release: prepare dupey ${RELEASE_VERSION}"
          branch="release/v${RELEASE_VERSION}"
          git push origin "HEAD:${branch}"
          echo "RELEASE_BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Create version bump pull request
        if: steps.version.outputs.needs_bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: release/v${{ inputs.version }}
        run: |
          gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "release: prepare dupey ${RELEASE_VERSION}" \
            --body "Automated version bump for dupey ${RELEASE_VERSION}. Merge this PR, then rerun Prepare release for the same version to create the tag and GitHub Release."
          echo "Version bump PR created; rerun this workflow after it merges."
          exit 0

      - name: Create release tag
        if: steps.version.outputs.needs_bump == 'false'
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${RELEASE_VERSION}"
          git tag -a "$tag" -m "dupey ${RELEASE_VERSION}"
          git push origin "$tag"

      - name: Create GitHub Release
        if: steps.version.outputs.needs_bump == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v${RELEASE_VERSION}" --verify-tag --generate-notes
