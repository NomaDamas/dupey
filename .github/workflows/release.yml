---
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 |
            jq -r '[.packages[] | select(.name == "dupey-core")][0].version')"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "Publishing is only allowed from a tag ref."
            exit 1
          fi
          expected="${GITHUB_REF_NAME#v}"
          if [[ -n "$RELEASE_VERSION" ]]; then
            test "$RELEASE_VERSION" = "$expected"
          fi
          test "$expected" = "$version"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build dupey-core package
        run: cargo package --locked -p dupey-core

      - name: Authenticate with crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish dupey-core
        run: cargo publish --locked -p dupey-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}

      - name: Build dupey package
        run: cargo package --locked -p dupey

      - name: Publish dupey
        run: cargo publish --locked -p dupey
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
