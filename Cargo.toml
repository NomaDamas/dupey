[workspace]
resolver = "2"
members = ["crates/dupey-core", "crates/dupey-cli"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/NomaDamas/dupey"
homepage = "https://github.com/NomaDamas/dupey"
authors = ["NomaDamas"]

[workspace.dependencies]
dupey-core = { path = "crates/dupey-core", version = "0.3.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gaoya = "0.2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp", "tiff"] }
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
walkdir = "2"
